<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Alisha 💖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Montserrat,sans-serif}
    body{
      min-height:100vh;display:grid;place-items:center;overflow:hidden;
      background:
        radial-gradient(circle at 15% 20%,rgba(255,255,255,.28),transparent 28%),
        radial-gradient(circle at 85% 75%,rgba(255,214,239,.32),transparent 30%),
        linear-gradient(135deg,#ff8fab,#ffc6d9 45%,#9bdcff);
    }
    .sparkles{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:34px 34px;opacity:.18}
    .card{
      position:relative;width:min(92vw,560px);padding:42px 28px;text-align:center;
      border:1px solid rgba(255,255,255,.55);border-radius:34px;
      background:rgba(255,255,255,.20);backdrop-filter:blur(18px);
      box-shadow:0 30px 80px rgba(75,35,85,.25);
    }
    .tiny{letter-spacing:.28em;text-transform:uppercase;font-size:.72rem;font-weight:700}
    h1{font-family:"DM Serif Display",serif;font-size:clamp(2.7rem,10vw,5rem);margin:12px 0 6px;color:#fff;text-shadow:0 6px 24px rgba(104,38,73,.25)}
    .subtitle{color:#fff;font-size:1rem;margin:0 0 24px}
    .qr-wrap{width:260px;height:260px;margin:24px auto;padding:18px;background:#fff;border-radius:26px;display:grid;place-items:center;box-shadow:0 18px 45px rgba(91,34,76,.24)}
    #qrcode{display:grid;place-items:center}
    #qrcode img{display:block;border-radius:4px}
    .hint{color:#fff;font-weight:600;margin:18px 0 6px}
    .note{color:rgba(255,255,255,.85);font-size:.82rem;line-height:1.5}
    .heart{font-size:2rem;animation:float 2.2s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-8px) rotate(4deg)}}
  </style>
</head>
<body>
  <div class="sparkles"></div>
  <main class="card">
    <div class="heart">💖</div>
    <div class="tiny">A little surprise for</div>
    <h1>Alisha</h1>
    <p class="subtitle">Something beautiful is waiting for you...</p>
    <div class="qr-wrap"><div id="qrcode"></div></div>
    <div class="hint">Scan the QR code to open your surprise ✨</div>
    <div class="note">Use your phone camera. The birthday surprise will open automatically.</div>
  </main>
  <script>
    const target = new URL("surprise.html", window.location.href).href;
    new QRCode(document.getElementById("qrcode"), {
      text: target, width: 220, height: 220,
      colorDark: "#251323", colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
